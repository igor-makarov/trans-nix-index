name: migrate-data
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: published-data
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Copy releases to GHCR and verify round-trip checksums
        run: mise run nix -- develop --command python3 tools/migrate-releases.py
