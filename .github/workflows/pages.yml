name: pages
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'nix/**'
      - 'tools/**'
      - 'scripts/**'
      - '*.nix'
      - '.github/**'
  workflow_run:
    workflows: [update-index, census]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  publication:
    if: >-
      (github.event_name == 'workflow_dispatch' || vars.DISABLE_PAGES != 'true') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04-arm
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: check
        name: Skip successful data runs that published nothing
        env:
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          if [[ "$EVENT" != workflow_run ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            published=$(python3 tools/check-publication.py "$RUN_ID" "$RUN_ATTEMPT")
            echo "deploy=$published" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    needs: publication
    concurrency:
      group: pages
      cancel-in-progress: true
    if: needs.publication.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: jdx/mise-action@v4
      - name: Build and export site from Docker
        run: mise run nix -- develop --command bash scripts/ci/pages
      - name: Browser tests
        run: mise run nix -- develop --command bash -c 'SITE_ROOT="$PWD/_site" nix run ".#test-site"'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
