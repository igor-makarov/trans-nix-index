name: pipeline-deploy
on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      digest:
        type: string
        required: true
permissions:
  contents: read
  packages: write
  pages: write
  id-token: write
env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ inputs.repository }}
  UPSTREAM: ${{ inputs.digest }}
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - id: check
        run: |
          mkdir -p _ci
          nix develop --command python3 tools/pipeline-artifact.py deployment-check deployed-site --repository "$REPOSITORY" --digest "$UPSTREAM" > _ci/deployment.json
          python3 -c 'import json; print("run="+str(json.load(open("_ci/deployment.json"))["run"]).lower())' >> "$GITHUB_OUTPUT"
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Pull tested site by digest
        run: nix develop --command python3 tools/pipeline-artifact.py pull site --repository "$REPOSITORY" --digest "$UPSTREAM" --path _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Record successful deployment
        run: nix develop --command python3 tools/pipeline-artifact.py deployed deployed-site --repository "$REPOSITORY" --digest "$UPSTREAM"
