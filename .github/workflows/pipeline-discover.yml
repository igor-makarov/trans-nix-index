name: pipeline-discover
on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      limit:
        type: string
        default: ''
    outputs:
      digest:
        value: ${{ jobs.discover.outputs.digest }}
permissions:
  contents: read
  packages: write
jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ inputs.repository }}
      PIPELINE_LIMIT: ${{ inputs.limit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Discover revisions and releases
        run: nix develop --command bash scripts/ci/discover-pure
      - id: publish
        run: |
          digest=$(nix develop --command python3 tools/pipeline-artifact.py publish revision-manifest --repository "$REPOSITORY" --path _ci/pure/inputs)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
