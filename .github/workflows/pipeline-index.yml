name: pipeline-index
on:
  workflow_call:
    inputs:
      repository:
        type: string
        required: true
      digest:
        type: string
        required: true
      force:
        type: boolean
        default: false
      max_shards:
        type: number
        default: 20
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true
    outputs:
      digest:
        value: ${{ jobs.merge.outputs.digest || jobs.plan.outputs.digest }}
permissions:
  actions: read
  contents: read
  packages: write
env:
  GH_TOKEN: ${{ github.token }}
  REPOSITORY: ${{ inputs.repository }}
  UPSTREAM: ${{ inputs.digest }}
jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      run: ${{ steps.plan.outputs.run }}
      digest: ${{ steps.plan.outputs.digest }}
      matrix: ${{ steps.plan.outputs.matrix }}
      artifact: ${{ steps.artifact.outputs.artifact-id }}
    env:
      FORCE: ${{ inputs.force }}
      MAX_SHARDS: ${{ inputs.max_shards }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - id: plan
        run: |
          mkdir -p _ci/pure
          force=()
          if [[ "$FORCE" == true ]]; then force=(--force); fi
          nix develop --command python3 tools/pipeline-artifact.py check revision-index --repository "$REPOSITORY" --input "$UPSTREAM" "${force[@]}" > _ci/check.json
          python3 -c 'import json; d=json.load(open("_ci/check.json")); print("run="+str(d["run"]).lower()); print("digest="+d["digest"])' >> "$GITHUB_OUTPUT"
          echo 'matrix={"include":[{"shard":0}]}' >> "$GITHUB_OUTPUT"
          if [[ $(python3 -c 'import json; print(json.load(open("_ci/check.json"))["run"])') == True ]]; then
            nix develop --command python3 tools/pipeline-artifact.py pull revision-manifest --repository "$REPOSITORY" --digest "$UPSTREAM" --path _ci/pure/inputs
            nix develop --command env GITHUB_OUTPUT=/workspace/_ci/pure/plan.outputs python3 tools/revision-shards.py plan _ci/pure/inputs/matrix.json --shards "$MAX_SHARDS"
            cat _ci/pure/plan.outputs >> "$GITHUB_OUTPUT"
          fi
      - id: artifact
        uses: actions/upload-artifact@v7
        if: steps.plan.outputs.run == 'true'
        with:
          name: revision-plan-${{ github.run_attempt }}
          path: _ci/pure/inputs
          if-no-files-found: error
  revisions:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      PIPELINE_SHARD: ${{ strategy.job-index }}
      PIPELINE_SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          merge-multiple: true
          path: _ci/pure/inputs
      - name: Build cache misses
        run: nix develop --command python3 tools/revision-shards.py build _ci/pure/inputs/matrix.json --shards "$PIPELINE_SHARDS"
      - uses: actions/upload-artifact@v7
        with:
          name: revision-receipts-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: _ci/pure/inputs/revision-paths/
          if-no-files-found: error
          retention-days: 7
  merge:
    needs: [plan, revisions]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.plan.outputs.artifact }}
          merge-multiple: true
          path: _ci/pure/inputs
      - id: receipts
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: python3 tools/pipeline-receipts.py revision-receipts >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.receipts.outputs.ids }}
          merge-multiple: true
          path: _ci/pure/inputs/revision-paths
      - name: Merge revisions
        run: nix develop --command bash scripts/ci/merge-pure
      - id: publish
        run: |
          digest=$(nix develop --command python3 tools/pipeline-artifact.py publish revision-index --repository "$REPOSITORY" --input "$UPSTREAM" --path _ci/pure/merged-revisions)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
