name: pure-index
run-name: pure index (${{ inputs.limit || 'all' }} revisions, ${{ inputs.scope }})
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'GHCR namespace: production or a named trial (e.g. trial-400)'
        type: string
        default: trial
      limit:
        description: 'Maximum recent revisions; blank means all'
        type: string
        default: ''
      max_shards:
        description: 'Revision and enrichment shards (1–256)'
        type: number
        default: 20
      force:
        description: 'Rerun stages even when their input digest is unchanged'
        type: boolean
        default: false
      enrich:
        description: 'Enrich the index and build/browser-test the site'
        type: boolean
        default: true
      census:
        description: 'Refresh payload observations (requires force for unchanged inputs)'
        type: boolean
        default: false
      deploy:
        description: 'Deploy tested site (main, production, full index only)'
        type: boolean
        default: false
permissions:
  actions: read
  contents: read
  packages: write
  pages: write
  id-token: write
# Named tags are mutable: serialize their producers for the entire pipeline.
concurrency:
  group: pure-index-${{ inputs.scope }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04-arm
    outputs:
      repository: ${{ steps.validate.outputs.repository }}
    env:
      SCOPE: ${{ inputs.scope }}
      LIMIT: ${{ inputs.limit }}
      SHARDS: ${{ inputs.max_shards }}
      ENRICH: ${{ inputs.enrich }}
      CENSUS: ${{ inputs.census }}
      DEPLOY: ${{ inputs.deploy }}
    steps:
      - id: validate
        run: |
          [[ "$SCOPE" =~ ^[a-z][a-z0-9-]{0,40}$ ]]
          [[ -z "$LIMIT" || "$LIMIT" =~ ^[1-9][0-9]*$ ]]
          [[ "$SHARDS" =~ ^[1-9][0-9]{0,2}$ ]] && (( SHARDS <= 256 ))
          if [[ "$SCOPE" == production ]]; then
            [[ "$GITHUB_REF" == refs/heads/main && -z "$LIMIT" ]]
          fi
          if [[ "$DEPLOY" == true ]]; then
            [[ "$SCOPE" == production && "$ENRICH" == true ]]
          fi
          if [[ "$CENSUS" == true ]]; then [[ "$ENRICH" == true ]]; fi
          echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}-pipeline-$SCOPE" >> "$GITHUB_OUTPUT"
  discover:
    needs: validate
    uses: ./.github/workflows/pipeline-discover.yml
    with:
      repository: ${{ needs.validate.outputs.repository }}
      limit: ${{ inputs.limit }}
  index:
    needs: [validate, discover]
    uses: ./.github/workflows/pipeline-index.yml
    secrets: inherit
    with:
      repository: ${{ needs.validate.outputs.repository }}
      digest: ${{ needs.discover.outputs.digest }}
      max_shards: ${{ inputs.max_shards }}
      force: ${{ inputs.force }}
  enrich:
    needs: [validate, index]
    if: inputs.enrich
    uses: ./.github/workflows/pipeline-enrich.yml
    with:
      repository: ${{ needs.validate.outputs.repository }}
      digest: ${{ needs.index.outputs.digest }}
      max_shards: ${{ inputs.max_shards }}
      force: ${{ inputs.force || inputs.census }}
      census: ${{ inputs.census }}
  site:
    needs: [validate, enrich]
    uses: ./.github/workflows/pipeline-site.yml
    with:
      repository: ${{ needs.validate.outputs.repository }}
      digest: ${{ needs.enrich.outputs.digest }}
      force: ${{ inputs.force }}
  deploy:
    needs: [validate, site]
    if: inputs.deploy
    uses: ./.github/workflows/pipeline-deploy.yml
    with:
      repository: ${{ needs.validate.outputs.repository }}
      digest: ${{ needs.site.outputs.digest }}
