name: pure-index
run-name: pure index (${{ inputs.limit }} new revisions)
on:
  workflow_dispatch:
    inputs:
      observation_previous:
        description: 'Optional enriched snapshot for cache-observation reuse only'
        type: string
        default: ''
      limit:
        description: 'Maximum new revisions during rollout'
        type: choice
        options: ['1', '2', '3', '4', '8', '100']
        default: '1'
      max_shards:
        description: 'Maximum revision and enrichment shards (1–256)'
        type: number
        default: 256
      enrich:
        description: 'Run external cache observation (can be expensive)'
        type: boolean
        default: false
      census:
        description: 'Also census known paths and NAR payloads'
        type: boolean
        default: false
      deploy:
        description: 'Deploy after observation and browser tests'
        type: boolean
        default: false
env:
  PIPELINE_MAX_SHARDS: ${{ inputs.max_shards }}
permissions:
  contents: read
# Covers the entire graph, including optional observation and deployment.
concurrency:
  group: pure-index-trial
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      manifest: ${{ steps.manifest.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      PIPELINE_LIMIT: ${{ inputs.limit }}
      PIPELINE_ENRICH: ${{ inputs.enrich }}
      PIPELINE_CENSUS: ${{ inputs.census }}
      PIPELINE_DEPLOY: ${{ inputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate rollout gates
        run: |
          if [[ ! "$PIPELINE_MAX_SHARDS" =~ ^[1-9][0-9]{0,2}$ ]] || (( PIPELINE_MAX_SHARDS > 256 )); then
            echo 'max_shards must be an integer from 1 to 256' >&2
            exit 1
          fi
          if [[ ( "$PIPELINE_DEPLOY" == true || "$PIPELINE_CENSUS" == true ) && "$PIPELINE_ENRICH" != true ]]; then
            echo 'Deployment and census require enrichment' >&2
            exit 1
          fi
      - name: Discover bounded channel metadata
        run: bash scripts/ci/discover-pure
      - id: plan
        name: Partition revisions into bounded shards
        run: python3 tools/revision-shards.py plan _ci/pure/inputs/matrix.json --shards "$PIPELINE_MAX_SHARDS"
      - id: manifest
        uses: actions/upload-artifact@v7
        with:
          name: revision-build-plan${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: _ci/pure/inputs/
          if-no-files-found: error
          retention-days: 30
  revisions:
    needs: discover
    name: revision shard ${{ strategy.job-index }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      PIPELINE_SHARD: ${{ strategy.job-index }}
      PIPELINE_SHARDS: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.discover.outputs.manifest }}
          merge-multiple: true
          path: _ci/pure/inputs
      - uses: ./.github/actions/setup-nix
      - name: Skip cached revisions; build and publish missing ones
        run: python3 tools/monitor-runner.py _ci/pure/metrics/runner.jsonl mise run nix -- develop --command python3 tools/revision-shards.py build _ci/pure/inputs/matrix.json --shards "$PIPELINE_SHARDS"
      - name: Publish revision output receipts
        uses: actions/upload-artifact@v7
        with:
          name: cached-revision-paths-shard-${{ strategy.job-index }}${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: _ci/pure/inputs/revision-paths/
          if-no-files-found: error
          retention-days: 30
      - name: Upload runner utilization
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: resource-usage-shard-${{ strategy.job-index }}${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: _ci/pure/metrics/
          retention-days: 7
  merge_revisions:
    name: merge revisions
    needs: [discover, revisions]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      result: ${{ steps.result.outputs.path }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.discover.outputs.manifest }}
          merge-multiple: true
          path: _ci/pure/inputs
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@v8
        with:
          pattern: cached-revision-paths-shard-*${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          merge-multiple: true
          path: _ci/pure/inputs/revision-paths
      - name: Merge cached revisions
        run: mise run nix -- develop --command bash scripts/ci/merge-pure
      - id: result
        run: |
          echo "path=$(cat _ci/pure/result-path)" >> "$GITHUB_OUTPUT"
          echo "Pure Cachix result — $(cat _ci/pure/result-path)" >> "$GITHUB_STEP_SUMMARY"
  enrich:
    name: enrichment shard ${{ strategy.job-index }}
    needs: [discover, merge_revisions]
    if: inputs.enrich
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      PIPELINE_RESULT: ${{ needs.merge_revisions.outputs.result }}
      PIPELINE_PREVIOUS: ${{ inputs.observation_previous }}
      PIPELINE_SHARD: ${{ strategy.job-index }}
      PIPELINE_SHARDS: ${{ strategy.job-total }}
    outputs:
      shards: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: crawl assigned package roots and dependencies
        run: python3 tools/monitor-runner.py _ci/pure/enrichment-metrics/runner.jsonl mise run nix -- develop --command bash scripts/ci/enrich-shard
      - name: publish enrichment observations
        uses: actions/upload-artifact@v7
        with:
          name: enrichment-observations-shard-${{ strategy.job-index }}${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: _ci/pure/enrichment-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: publish enrichment resource usage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enrichment-resource-usage-shard-${{ strategy.job-index }}${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          path: _ci/pure/enrichment-metrics/
          retention-days: 7
  merge_enrichment:
    name: merge enrichment
    needs: [merge_revisions, enrich]
    if: inputs.enrich
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      result: ${{ steps.result.outputs.path }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      PIPELINE_RESULT: ${{ needs.merge_revisions.outputs.result }}
      PIPELINE_ENRICH_SHARDS: /workspace/_ci/pure/enrichment-artifacts
      PIPELINE_SHARDS: ${{ needs.enrich.outputs.shards }}
      PIPELINE_PREVIOUS: ${{ inputs.observation_previous }}
      PIPELINE_CENSUS: ${{ inputs.census }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - uses: actions/download-artifact@v8
        with:
          pattern: enrichment-observations-shard-*${{ github.run_attempt > 1 && format('-attempt-{0}', github.run_attempt) || '' }}
          merge-multiple: true
          path: _ci/pure/enrichment-artifacts
      - name: merge observations and optionally census payloads
        run: mise run nix -- develop --command bash scripts/ci/enrich-pure
      - id: result
        run: |
          echo "path=$(cat _ci/pure/result-path)" >> "$GITHUB_OUTPUT"
          echo "Enriched Cachix result — $(cat _ci/pure/result-path)" >> "$GITHUB_STEP_SUMMARY"
  pages:
    needs: merge_enrichment
    if: inputs.deploy
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      PIPELINE_RESULT: ${{ needs.merge_enrichment.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Build and browser-test this exact snapshot
        run: mise run nix -- develop --command bash scripts/ci/pages-pure
      - uses: actions/configure-pages@v6
        if: inputs.deploy
      - uses: actions/upload-pages-artifact@v5
        if: inputs.deploy
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
        if: inputs.deploy
