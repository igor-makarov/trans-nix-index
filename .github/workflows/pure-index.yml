name: pure-index
run-name: Pure index (${{ inputs.limit }} new revisions)
on:
  workflow_dispatch:
    inputs:
      observation_previous:
        description: 'Optional enriched snapshot for cache-observation reuse only'
        type: string
        default: ''
      limit:
        description: 'Maximum new revisions during rollout'
        type: choice
        options: ['1', '2', '3', '4', '8']
        default: '1'
      enrich:
        description: 'Run external cache observation (can be expensive)'
        type: boolean
        default: false
      census:
        description: 'Also census known paths and NAR payloads'
        type: boolean
        default: false
      deploy:
        description: 'Deploy after observation and browser tests'
        type: boolean
        default: false
permissions:
  contents: read
# Covers the entire graph, including optional observation and deployment.
concurrency:
  group: pure-index-trial
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      manifest: ${{ steps.manifest.outputs.artifact-id }}
    env:
      GH_TOKEN: ${{ github.token }}
      PIPELINE_LIMIT: ${{ inputs.limit }}
      PIPELINE_ENRICH: ${{ inputs.enrich }}
      PIPELINE_CENSUS: ${{ inputs.census }}
      PIPELINE_DEPLOY: ${{ inputs.deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate rollout gates
        run: |
          if [[ ( "$PIPELINE_DEPLOY" == true || "$PIPELINE_CENSUS" == true ) && "$PIPELINE_ENRICH" != true ]]; then
            echo 'Deployment and census require enrichment' >&2
            exit 1
          fi
      - name: Discover bounded channel metadata
        run: bash scripts/ci/discover-pure
      - id: plan
        name: Partition revisions into one trial shard
        # Temporary single-shard lane trial; partitioner defaults to 256.
        run: python3 tools/revision-shards.py plan _ci/pure/inputs/matrix.json --shards 1
      - id: manifest
        uses: actions/upload-artifact@v7
        with:
          name: pure-manifest-${{ github.run_attempt }}
          path: _ci/pure/inputs/
          if-no-files-found: error
          retention-days: 30
  revisions:
    needs: discover
    name: Revision shard ${{ matrix.shard }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      PIPELINE_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.discover.outputs.manifest }}
          merge-multiple: true
          path: _ci/pure/inputs
      - uses: ./.github/actions/setup-nix
      - name: Skip cached revisions; build and publish missing ones
        run: python3 tools/monitor-runner.py _ci/pure/metrics/runner.jsonl mise run nix -- develop --command python3 tools/revision-shards.py build _ci/pure/inputs/matrix.json --shards 1
      - name: Upload runner utilization
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runner-${{ github.run_attempt }}-${{ matrix.shard }}
          path: _ci/pure/metrics/
          retention-days: 7
  merge:
    needs: [discover, revisions]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    outputs:
      result: ${{ steps.result.outputs.path }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.discover.outputs.manifest }}
          merge-multiple: true
          path: _ci/pure/inputs
      - uses: ./.github/actions/setup-nix
      - name: Merge cached revisions
        run: mise run nix -- develop --command bash scripts/ci/merge-pure
      - id: result
        run: |
          echo "path=$(cat _ci/pure/result-path)" >> "$GITHUB_OUTPUT"
          echo "Pure Cachix result — $(cat _ci/pure/result-path)" >> "$GITHUB_STEP_SUMMARY"
  observe:
    needs: merge
    if: inputs.enrich
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    outputs:
      result: ${{ steps.result.outputs.path }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      PIPELINE_RESULT: ${{ needs.merge.outputs.result }}
      PIPELINE_PREVIOUS: ${{ inputs.observation_previous }}
      PIPELINE_CENSUS: ${{ inputs.census }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Observe cache and optionally census payloads
        run: mise run nix -- develop --command bash scripts/ci/enrich-pure
      - id: result
        run: |
          echo "path=$(cat _ci/pure/result-path)" >> "$GITHUB_OUTPUT"
          echo "Enriched Cachix result — $(cat _ci/pure/result-path)" >> "$GITHUB_STEP_SUMMARY"
  pages:
    needs: observe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      PIPELINE_RESULT: ${{ needs.observe.outputs.result }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix
      - name: Build and browser-test this exact snapshot
        run: mise run nix -- develop --command bash scripts/ci/pages-pure
      - uses: actions/configure-pages@v6
        if: inputs.deploy
      - uses: actions/upload-pages-artifact@v5
        if: inputs.deploy
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
        if: inputs.deploy
