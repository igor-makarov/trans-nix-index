name: rename-snapshots
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: published-data
  cancel-in-progress: false
jobs:
  rename:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Add timestamp aliases without changing snapshot digests
        run: mise run nix -- develop --command python3 tools/rename-snapshots.py
