name: update-index
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
concurrency:
  group: published-data
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || vars.DISABLE_SCHEDULES != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EVAL_WORKERS: '2'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/mise
      - name: Restore latest snapshot, update incrementally, publish OCI artifact
        run: mise run nix -- develop --command bash scripts/ci/update
