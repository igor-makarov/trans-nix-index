[tools]
colima = "latest"
docker-cli = "latest"
lima = "latest"

[settings]
lockfile = true
lockfile_platforms = ["macos-arm64", "linux-arm64"]

[tasks.nix]
description = "Run Nix in Docker against the current directory"
run = "./scripts/nix"
raw = true

[tasks."nix:reset"]
description = "Delete the shared Nix store and cache volumes (destructive; recreated on next run)"
run = "docker volume rm trans-nix-index-nix trans-nix-index-cache"
